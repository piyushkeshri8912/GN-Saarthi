  <!-- Message Bubble -->
  <path d="M16 7C10.48 7 6 10.81 6 15.5C6 18.07 7.36 20.35 9.5 21.9V26L13.8 23.4C14.51 23.79 15.24 24 16 24C21.52 24 26 20.19 26 15.5C26 10.81 21.52 7 16 7Z" fill="white" />
  
  <!-- AI Sparkle shape in the center -->
